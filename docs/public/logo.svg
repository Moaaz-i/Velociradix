<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Core Speed Gradient -->
    <linearGradient id="vrxGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    
    <!-- Accent Gradient -->
    <linearGradient id="vrxAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="vrxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00E5FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Main Geometric Monogram: Radix Trie + Speed Vector V -->
  <g filter="url(#vrxGlow)">
    <!-- Left Wing -->
    <path d="M30 40 L85 155 L105 155 L65 40 Z" fill="url(#vrxGrad)" />
    
    <!-- Right Fast-Path Wing -->
    <path d="M170 40 L115 155 L95 155 L135 40 Z" fill="url(#vrxAccent)" />

    <!-- Center Lightning Radix Node Branch -->
    <polygon points="100,25 118,75 92,85 110,135 78,82 102,72" fill="#00E5FF" opacity="0.95" />

    <!-- Radix Trie Node Points (Network Endpoints) -->
    <circle cx="30" cy="40" r="5" fill="#00E5FF" />
    <circle cx="65" cy="40" r="4.5" fill="#38BDF8" />
    <circle cx="135" cy="40" r="4.5" fill="#818CF8" />
    <circle cx="170" cy="40" r="5" fill="#6366F1" />
    <circle cx="100" cy="165" r="6" fill="#00E5FF" />
  </g>

  <!-- Connecting Node Lines -->
  <line x1="30" y1="40" x2="65" y2="40" stroke="#00E5FF" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="135" y1="40" x2="170" y2="40" stroke="#6366F1" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
</svg>
