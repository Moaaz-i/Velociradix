<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%" style="background: transparent; border-radius: 16px; font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7c4dff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#00e5ff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .window { fill: #0a0e1a; stroke: rgba(0, 229, 255, 0.25); stroke-width: 1.5; }
    .header { fill: #111728; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { fill: #94a3b8; font-size: 13px; font-weight: 600; }
    .prompt { fill: #00e5ff; font-weight: 700; }
    .cmd { fill: #f8fafc; font-weight: 500; font-size: 14px; }
    .out-green { fill: #10b981; font-weight: 600; font-size: 13.5px; }
    .out-cyan { fill: #38bdf8; font-weight: 600; font-size: 13.5px; }
    .out-dim { fill: #64748b; font-size: 13px; }
    .out-white { fill: #e2e8f0; font-size: 13.5px; }
    .out-orange { fill: #fb923c; font-weight: 600; font-size: 13.5px; }
    .metric-badge { fill: #1e293b; stroke: #00e5ff; stroke-width: 1; }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor { fill: #00e5ff; animation: blink 0.9s infinite; }

    @keyframes fadeInStep1 { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes fadeInStep2 { 0%, 18% { opacity: 0; } 28% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes fadeInStep3 { 0%, 38% { opacity: 0; } 48% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes fadeInStep4 { 0%, 58% { opacity: 0; } 68% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes fadeInStep5 { 0%, 78% { opacity: 0; } 88% { opacity: 1; } 100% { opacity: 1; } }

    .step1 { animation: fadeInStep1 8s infinite; }
    .step2 { animation: fadeInStep2 8s infinite; }
    .step3 { animation: fadeInStep3 8s infinite; }
    .step4 { animation: fadeInStep4 8s infinite; }
    .step5 { animation: fadeInStep5 8s infinite; }
  </style>

  <!-- Window container with shadow & glowing border -->
  <rect x="15" y="15" width="850" height="430" rx="14" class="window" filter="url(#shadow)" />

  <!-- Terminal Header Bar -->
  <rect x="15" y="15" width="850" height="42" rx="14" class="header" />
  <circle cx="42" cy="36" r="6" class="dot-red" />
  <circle cx="62" cy="36" r="6" class="dot-yellow" />
  <circle cx="82" cy="36" r="6" class="dot-green" />
  <text x="440" y="40" text-anchor="middle" class="title">⚡ Velociradix C++17 Core Engine — Live Demo</text>

  <!-- Step 1: Starting server -->
  <g class="step1">
    <text x="40" y="90" class="prompt">❯</text>
    <text x="60" y="90" class="cmd">node server.js</text>
  </g>

  <!-- Step 2: Server initialization output -->
  <g class="step2">
    <text x="40" y="125" class="out-green">⚡ [Velociradix v7.5.4] Native C++17 Engine initialized with SO_REUSEPORT (4 Workers)</text>
    <text x="40" y="150" class="out-dim">🚀 Radix Trie Router: 24 routes compiled in 0.04ms</text>
    <text x="40" y="175" class="out-cyan">📡 Listening on: http://localhost:3000 (Swagger UI at /docs)</text>
  </g>

  <!-- Step 3: Client execution -->
  <g class="step3">
    <text x="40" y="220" class="prompt">❯</text>
    <text x="60" y="220" class="cmd">node client.js</text>
  </g>

  <!-- Step 4: Client response output -->
  <g class="step4">
    <text x="40" y="255" class="out-dim">// 1. Type-Safe Path Chaining: api.users['1'].get()</text>
    <text x="40" y="280" class="out-white">HTTP/1.1 200 OK  [22 bytes, 0.2ms]</text>
    <text x="40" y="305" class="out-cyan">{ status: 200, data: { id: 1, name: "Moaaz", role: "SuperAdmin" } }</text>
  </g>

  <!-- Step 5: Benchmark Autocannon stats badge -->
  <g class="step5">
    <rect x="40" y="335" width="800" height="75" rx="8" class="metric-badge" />
    <text x="60" y="365" class="out-orange">⚡ Autocannon Benchmark: 100 connections @ 10.05s</text>
    <text x="60" y="392" class="out-green">✔ 1,814,200 Requests in 10s │ Avg: 181,420 req/s │ Latency: 0.52ms │ 0 Errors</text>
    <rect x="735" y="220" width="8" height="15" class="cursor" />
  </g>
</svg>
