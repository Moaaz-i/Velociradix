name: Version Bump & Release PR

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'package.json'
      - '.github/workflows/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check NPM Published Version & Calculate Bump
        id: bump
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view velociradix version 2>/dev/null || echo "0.0.0")
          echo "Local version: $LOCAL_VER"
          echo "Published npm version: $REMOTE_VER"

          BUMP_TYPE="${{ inputs.bump_type }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi

          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            npm version $BUMP_TYPE --no-git-tag-version
            NEW_VER=$(node -p "require('./package.json').version")
            echo "NEED_PR=true" >> $GITHUB_OUTPUT
            echo "NEW_VERSION=$NEW_VER" >> $GITHUB_OUTPUT
            echo "Bumped version from $LOCAL_VER to $NEW_VER"
          else
            echo "NEED_PR=false" >> $GITHUB_OUTPUT
            echo "Local version $LOCAL_VER is newer than npm $REMOTE_VER. No bump required."
          fi

      - name: Create Release Pull Request
        if: steps.bump.outputs.NEED_PR == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(release): bump version to ${{ steps.bump.outputs.NEW_VERSION }}"
          title: "🚀 Release v${{ steps.bump.outputs.NEW_VERSION }} - Version Bump"
          body: |
            ## 🚀 Automated Version Bump & Release PR
            
            This PR bumps the package version to `v${{ steps.bump.outputs.NEW_VERSION }}`.
            
            ### Actions:
            - **Review & Approve**: Merge this Pull Request to trigger the automated build & publish to npm.
            - **Published Package**: `velociradix@${{ steps.bump.outputs.NEW_VERSION }}`
          branch: "release/v${{ steps.bump.outputs.NEW_VERSION }}"
          delete-branch: true
          assignees: Moaaz-i
          labels: release, automated-pr
