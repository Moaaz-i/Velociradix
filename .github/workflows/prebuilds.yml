name: Build Native Prebuilds

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-prebuilds:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            platform: linux
          - os: macos-latest
            arch: arm64
            platform: darwin
          - os: windows-latest
            arch: x64
            platform: win32

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Native Addon (Unix)
        if: runner.os != 'Windows'
        run: |
          node scripts/install.mjs
          mkdir -p prebuilds/${{ matrix.platform }}-${{ matrix.arch }}
          cp bin/velociradix.node prebuilds/${{ matrix.platform }}-${{ matrix.arch }}/velociradix.node

      - name: Build Native Addon (Windows)
        if: runner.os == 'Windows'
        run: |
          node scripts/install.mjs
          mkdir -p prebuilds/win32-x64
          cp bin/velociradix.node prebuilds/win32-x64/velociradix.node
        shell: bash

      - name: Upload Prebuild Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: prebuilds/

  publish-npm:
    name: Download Prebuilds and Publish to NPM
    needs: build-prebuilds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilds-temp/

      - name: Organize prebuilds folder
        run: |
          mkdir -p prebuilds
          cp -r prebuilds-temp/*/* prebuilds/ || true
          ls -R prebuilds/

      - name: Publish to NPM
        run: |
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view velociradix@$LOCAL_VER version 2>/dev/null || true)
          if [ "$REMOTE_VER" = "$LOCAL_VER" ]; then
            echo "::notice::Version velociradix@$LOCAL_VER is already published on npm. Skipping publish."
          else
            echo "Publishing velociradix@$LOCAL_VER to npm..."
            npm publish --access public --provenance
          fi


